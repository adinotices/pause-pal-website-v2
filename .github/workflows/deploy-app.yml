name: Deploy App to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-app
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy app to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: app

      - name: Wait for deployment
        run: sleep 15

      - name: Run database migrations
        run: |
          flyctl ssh console -C "cd /app && npm run drizzle:migrate" || echo "Migration failed or already run"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          APP_URL=$(flyctl info --json | jq -r '.appUrl')
          echo "App URL: $APP_URL"
          curl -f "$APP_URL/api/health" 2>/dev/null || echo "Health check endpoint not available (expected)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment successful"
          flyctl status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed - check logs above"
