# Fly.io configuration for PausePal app
# See https://fly.io/docs/reference/configuration/ for complete reference

app = "pausepal-app"
primary_region = "sjc"

[build]
  builder = "paketobuildpacks"
  buildpacks = ["gcr.io/paketo-buildpacks/nodejs"]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[services]]
  internal_port = 3000
  processes = ["app"]
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Scheduled cron job for sending reminders
[[crons]]
  handlers = ["http"]
  interval = "0 6 * * *"
  timeout = "300s"
  url = "/api/cron/reminders"

[deploy]
  strategy = "rolling"
  wait_timeout = "300s"

# Database auto-start configuration
[processes]
  app = "npm start"
